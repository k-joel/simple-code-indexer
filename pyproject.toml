[project]
name = "simple-code-indexer"
version = "0.1.0"
description = "Minimal code-index MCP server: file-watcher indexing into SQLite/FTS5 + FAISS (Qdrant optional)"
readme = "README.md"
authors = [
    { name = "k-joel", email = "kjoel86@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "code-search",
    "semantic-search",
    "sqlite",
    "fts5",
    "tree-sitter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "faiss-cpu>=1.15",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=1.25",
    "pathspec>=1.1.1",
    "pyyaml>=6.0",
    "qdrant-client>=1.19.1",
    "questionary>=2.1",
    "sqlite-vec>=0.1.9,<0.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.22.1",
    "watchdog>=6.0.0",
]

[project.scripts]
simple-code-indexer = "simple_code_indexer.cli:main"

[project.urls]
Homepage = "https://github.com/k-joel/simple-code-indexer"
Repository = "https://github.com/k-joel/simple-code-indexer"
Issues = "https://github.com/k-joel/simple-code-indexer/issues"
Changelog = "https://github.com/k-joel/simple-code-indexer/blob/master/docs/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # documentation code blocks are illustrative; ruff must not rewrite them

[tool.ruff.lint]
extend-select = [
    "UP",  # pyupgrade
    "I",   # isort
]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
