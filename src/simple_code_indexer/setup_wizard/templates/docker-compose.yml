# Generated by simple-code-indexer's setup.py; re-run it to update this file.
# The project name is set here (not `container_name`) so compose owns the
# container name: <project>-<service>-1.
name: ${PROJECT}
services:
  embed:
    image: ${IMAGE}
    environment:
      - LLAMA_ARG_MODEL=/models/${MODEL_FILE}
      - LLAMA_ARG_ALIAS=${API_MODEL}
      - LLAMA_ARG_CTX_SIZE=${CTX_SIZE}
${GPU_LAYERS}      - LLAMA_ARG_EMBEDDINGS=true
      - LLAMA_ARG_POOLING=${POOLING}
      - LLAMA_ARG_BATCH=2048
      - LLAMA_ARG_UBATCH=2048
    ports:
      - "127.0.0.1:${PORT}:8080"
    volumes:
      - ../model:/models:ro
    restart: unless-stopped
${GPU_BLOCK}
